<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobFit Analyzer Settings</title>
    <link rel="stylesheet" href="popup.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="12" y="10" width="6" height="18" fill="#0A1930"/>
                    <rect x="4" y="22" width="8" height="6" fill="#0A1930"/>
                    <rect x="20" y="10" width="6" height="14" fill="#0A1930"/>
                    <rect x="26" y="10" width="8" height="5" fill="#0A1930"/>
                    <rect x="26" y="17" width="5" height="5" fill="#0A1930"/>
                </svg>
                <h1>JobFit Analyzer</h1>
            </div>
            <p class="subtitle">Configure your resume and API key</p>
        </header>

        <main>


            <div class="input-group">
                <label for="resumeFile">Your Resume (PDF or DOCX)</label>
                <div id="drop-zone" class="drop-zone">
                    <span id="drop-zone-text">Click or drag file here to upload</span>
                    <input type="file" id="resumeFile" accept=".pdf,.docx" class="hidden-input">
                </div>
            </div>

            <button id="saveBtn" class="primary-btn">Save Configuration</button>
            <div id="statusMsg" class="status-msg hidden">Saved successfully!</div>
        </main>
    </div>
    <script src="lib/pdf.min.js"></script>
    <script src="lib/mammoth.browser.min.js"></script>
    <script src="popup.js"></script>
</body>
</html>
